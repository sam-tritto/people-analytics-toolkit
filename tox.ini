[tox]
minversion = 4.0
envlist = py310, py311, py312, typecheck
isolated_build = True

[testenv]
description = Run unit and integration tests with pytest
deps =
    pytest>=8.0.0
    hypothesis>=6.90.0
extras =
    all
commands =
    pytest {posargs:tests}

[testenv:typecheck]
description = Run static type checks with mypy
deps =
    mypy>=1.9.0
extras =
    all
commands =
    mypy src/

[testenv:build]
description = Build and verify distribution archives
deps =
    build>=1.0.0
    twine>=5.0.0
skip_install = true
commands =
    python -m build
    twine check dist/*
